* { margin:0; padding:0; box-sizing:border-box; }
html, body {

#stage {

  box-shadow: 0 0 100px rgba(0,0,0,0.9);

#world {
  position: absolute; inset: 0;

/* Bingkai Proscenium Teater */
.proscenium {
  position: absolute; inset: 0; pointer-events: none; z-index: 40;
}
.proscenium-top {
  position: absolute; left: 0; top: 0; right: 0; height: 110px;
  background: linear-gradient(180deg, #4A0E17 0%, #30080F 100%);

}
.pelmet-drape {
  position: absolute; bottom: -28px; left: 0; right: 0; height: 32px;
  background-image: radial-gradient(ellipse 40px 24px at 50% 0%, #781726 95%, transparent 100%);

.proscenium-left, .proscenium-right {
  position: absolute; top: 0; bottom: 0; width: 80px;
  background: linear-gradient(90deg, #30080F 0%, #4A0E17 100%);

.proscenium-left { left: 0; border-right: 4px solid var(--gold-accent); }
.proscenium-right { right: 0; border-left: 4px solid var(--gold-accent); background: linear-gradient(270deg, #30080F 0%, #4A0E17 100%); }

.theater-btn:hover {

<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

const W = 1920, H = 1080;
const DUR = 28.88; // Durasi tepat audio ElevenLabs

// Responsive Stage Fit
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  $('#stage').style.transform = `translate(-50%, -50%) scale(${s})`;
}
window.addEventListener('resize', fit);
fit();

// SVG Builder Helpers
const NS = 'http://www.w3.org/2000/svg';
const S = $('#scene');
function N(tag, a = {}, p = S) {
  const n = document.createElementNS(NS, tag);
  for (const k in a) n.setAttribute(k, a[k]);
  p.appendChild(n);
  return n;
}
const G = (a = {}, p = S) => N('g', a, p);
const R = (x, y, w, h, f, rx = 0, p = S, a = {}) => N('rect', { x, y, width: w, height: h, rx, fill: f, ...a }, p);
const CI = (cx, cy, r, f, p = S, a = {}) => N('circle', { cx, cy, r, fill: f, ...a }, p);
const EL = (cx, cy, rx, ry, f, p = S, a = {}) => N('ellipse', { cx, cy, rx, ry, fill: f, ...a }, p);
const PA = (d, f, p = S, a = {}) => N('path', { d, fill: f || 'none', ...a }, p);
const LN = (d, st, w, p = S, a = {}) => N('path', { d, fill: 'none', stroke: st, 'stroke-width': w, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', ...a }, p);
const TX = (x, y, t, size, f, p = S, a = {}) => {
  const n = N('text', { x, y, 'font-size': size, fill: f, 'font-weight': 700, 'text-anchor': 'middle', ...a }, p);
  n.textContent = t; return n;
};

// Shading utility
function sh(hex, factor) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.min(255, Math.max(0, Math.round(((n >> 16) & 255) * factor)));
  const g = Math.min(255, Math.max(0, Math.round(((n >> 8) & 255) * factor)));
  const b = Math.min(255, Math.max(0, Math.round((n & 255) * factor)));
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}

// HUKUM 5: Transform manual per sendi (Bukan bounding box GSAP)
function J(el, tx = 0, ty = 0) {
  const j = {
    el, tx, ty, x: 0, y: 0, r: 0, sx: 1, sy: 1,
    apply() {
      el.setAttribute('transform', `translate(${j.tx + j.x},${j.ty + j.y}) rotate(${j.r}) scale(${j.sx},${j.sy})`);
    }
  };
  j.apply();
  return j;
}

// Defs Gradients & Glows
const defs = N('defs', {}, S);

// Spotlight gradient
const gSpot = N('radialGradient', { id: 'gSpot', cx: '50%', cy: '0%', r: '80%' }, defs);
N('stop', { offset: '0%', 'stop-color': '#FFF7D6', 'stop-opacity': '0.45' }, gSpot);
N('stop', { offset: '60%', 'stop-color': '#F4DC8C', 'stop-opacity': '0.12' }, gSpot);
N('stop', { offset: '100%', 'stop-color': '#2A170F', 'stop-opacity': '0' }, gSpot);

// Wood floor gradient
const gWood = N('linearGradient', { id: 'gWood', x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
N('stop', { offset: '0%', 'stop-color': '#4A2C1C' }, gWood);
N('stop', { offset: '100%', 'stop-color': '#22120B' }, gWood);

// Tirai gradient
const gCurtain = N('linearGradient', { id: 'gCurtain', x1: 0, y1: 0, x2: 1, y2: 0 }, defs);
N('stop', { offset: '0%', 'stop-color': '#590E1A' }, gCurtain);
N('stop', { offset: '25%', 'stop-color': '#8B1B2D' }, gCurtain);
N('stop', { offset: '50%', 'stop-color': '#63111E' }, gCurtain);
N('stop', { offset: '75%', 'stop-color': '#9E2236' }, gCurtain);
N('stop', { offset: '100%', 'stop-color': '#590E1A' }, gCurtain);

/* ================== PANGGUNG SYSTEM ================== */
const scenes = [];
function createScene(name) {
  const g = G({ 'data-name': name }, S);
  g.style.display = 'none';
  const sc = {
    name, g,
    cam: { x: 960, y: 540, z: 1.14, ox: 0, oy: 0 },
    apply() {
      const c = sc.cam;
      g.setAttribute('transform', `translate(${960 - (c.x + c.ox) * c.z},${540 - (c.y + c.oy) * c.z}) scale(${c.z})`);
    }
  };
  sc.apply();
  scenes.push(sc);
  return sc;
}

// Gambar lantai kayu teater standar panggung
function drawTheaterFloor(p, yGround = 880) {
  R(-400, yGround, 2800, 360, 'url(#gWood)', 0, p);
  // Garis-garis papan kayu
  for (let y = yGround; y <= 1180; y += 38) {
    LN(`M -400 ${y} L 2400 ${y}`, '#180B05', 2.5, p, { opacity: 0.65 });
  }
  // Pendar spotlight di lantai
  EL(960, yGround + 20, 520, 80, 'url(#gSpot)', p);
}

/* ================== KARAKTER PUPPET: DICKY ==================

   - Kaos hitam, kemeja kasual terbuka abu-abu/charcoal

*/

  const root = J(rootEl);
  const ref = { root, place, scale, sd, x, ground };

    const sx = side === 'L' ? -28 : 28;
    const dk = side === 'R' ? 0.82 : 1.0;
    const tEl = G({}, rootEl);
    const thigh = J(tEl, sx, -214);
    // Paha
    R(-24, -10, 48, 118, sh(pantsColor, dk), 20, tEl);

    const sEl = G({}, tEl);
    const shin = J(sEl, 0, 104);
    // Betis / Tulang Kering
    R(-21, -8, 42, 110, sh(pantsColor, dk), 18, sEl);

    const fEl = G({}, sEl);
    const foot = J(fEl, 0, 98);
    // Sepatu Sneakers Putih/Krem
    PA('M -26 -10 L 16 -10 C 26 4 52 4 56 16 L 56 26 L -28 26 Z', sh(shoeColor, dk), fEl);
    // Sol & aksen abu-abu sneakers
    R(-28, 20, 84, 7, '#D4D0C6', 2, fEl);
    R(-14, 2, 28, 5, '#A09C90', 1, fEl);

    ref[side + 'thigh'] = thigh;
    ref[side + 'shin'] = shin;
    ref[side + 'foot'] = foot;
  }

  // Badan / Torso
  const torsoEl = G({}, rootEl);
  const torso = J(torsoEl, 0, -214);
  ref.torso = torso;

  // Lengan Kanan (belakang badan)
  const armR_El = G({}, torsoEl);
  const armR = J(armR_El, 52, -128);
  R(-18, -16, 36, 102, sh(jacketColor, 0.85), 16, armR_El);
  const foreR_El = G({}, armR_El);
  const foreR = J(foreR_El, 0, 80);
  R(-15, -12, 30, 92, sh(skinColor, 0.9), 14, foreR_El);
  const handR_El = G({}, foreR_El);
  const handR = J(handR_El, 0, 76);
  EL(0, 4, 18, 22, sh(skinColor, 0.9), handR_El);
  ref.Rarm = armR; ref.Rfore = foreR; ref.Rhand = handR;

  // Kaos Dalam Hitam
  PA('M -46 -154 C -60 -146 -64 -114 -60 -76 L -52 10 C -24 24 28 24 54 10 L 62 -76 C 66 -114 56 -146 42 -154 Z', shirtColor, torsoEl);

  // Kemeja Charcoal Terbuka (Flap Kiri & Kanan)
  PA('M -48 -154 L -66 -80 L -58 10 L -22 10 L -30 -140 Z', jacketColor, torsoEl);
  PA('M 44 -154 L 64 -80 L 56 10 L 20 10 L 28 -140 Z', jacketColor, torsoEl);
  // Kerah kemeja
  PA('M -30 -144 L -12 -170 L -4 -148 Z', '#363B43', torsoEl);
  PA('M 26 -144 L 8 -170 L 0 -148 Z', '#363B43', torsoEl);

  // Leher
  R(-15, -182, 30, 42, skinColor, 12, torsoEl);

  // Lengan Kiri (depan badan)
  const armL_El = G({}, torsoEl);
  const armL = J(armL_El, -52, -128);
  R(-18, -16, 36, 102, jacketColor, 16, armL_El);
  const foreL_El = G({}, armL_El);
  const foreL = J(foreL_El, 0, 80);
  R(-15, -12, 30, 92, skinColor, 14, foreL_El);
  const handL_El = G({}, foreL_El);
  const handL = J(handL_El, 0, 76);
  EL(0, 4, 18, 22, skinColor, handL_El);
  ref.Larm = armL; ref.Lfore = foreL; ref.Lhand = handL;

  // Kepala
  const headEl = G({}, torsoEl);
  const head = J(headEl, 0, -165);
  ref.head = head;

  // Telinga
  EL(-74, -72, 14, 20, skinColor, headEl);
  EL(74, -72, 14, 20, skinColor, headEl);

  // Struktur Wajah Dicky
  PA('M -74 -120 C -74 -178 74 -178 74 -120 L 74 -58 C 74 -2 -74 -2 -74 -58 Z', skinColor, headEl);

  // RAMBUT IKAL BERVOLUME HITAM (Ciri khas Dicky)
  // Bentuk gumpalan ikal yang bervolume & stylish
  const hairG = G({}, headEl);
  PA('M -82 -110 C -92 -170 -40 -205 0 -205 C 45 -205 94 -170 84 -110 C 76 -130 68 -150 40 -155 C 10 -160 -15 -145 -48 -140 C -70 -138 -76 -120 -82 -110 Z', hairColor, hairG);
  // Gelombang curl rambut

  CI(-22, -196, 30, hairColor, hairG);
  CI(22, -196, 30, hairColor, hairG);
  CI(58, -178, 26, hairColor, hairG);
  CI(-76, -148, 20, hairColor, hairG);
  CI(76, -148, 20, hairColor, hairG);
  // Poni ikal depan bervolume

  // Mata (Melek & Kedip)

  CI(-28, -78, 7.5, '#1A181B', eyeOpen);

  // Alis ekspresif
  LN('M -42 -98 Q -28 -108 -14 -98', '#1A181B', 4.5, headEl);

  ref.eyeOpen = eyeOpen;
  ref.eyeClosed = eyeClosed;

  // Senyum ramah
  ref.mouth = LN('M -18 -42 Q 0 -30 18 -42', '#7D3325', 5, headEl);

}

/* =========================================================================

function drawGear(p, gx, gy, gr, teeth, fill) {
  const g = G({}, p);
  CI(gx, gy, gr, fill, g);
  for (let i = 0; i < teeth; i++) {
    const ang = (i / teeth) * Math.PI * 2;
    const tx = gx + Math.cos(ang) * (gr + 12);
    const ty = gy + Math.sin(ang) * (gr + 12);
    R(tx - 12, ty - 12, 24, 24, fill, 4, g, { transform: `rotate(${(ang * 180) / Math.PI + 45}, ${tx}, ${ty})` });
  }
  CI(gx, gy, gr * 0.45, '#1C161D', g);
  CI(gx, gy, 14, '#E5A93C', g);
  return g;
}

/* ================= AUDIO & KONTROL (PLAY / PAUSE + SUARA OTOMATIS) ================= */
const vo = $('#vo');
const playOverlay = $('#play-overlay');
const btnToggle = $('#btn-toggle-play');
const toggleText = $('#toggle-text');
const toggleIcon = $('#toggle-icon');
const btnReplay = $('#btn-replay');
const subEl = $('#theater-subtitles');
const btnToggleSub = $('#btn-toggle-sub');
const subBtnText = $('#sub-btn-text');

let isPlaying = false;
let subEnabled = true;

const subtitles = [
  { start: 0.00, end: 1.33, text: "Halo! Saya Dicky." },
  { start: 1.90, end: 4.05, text: "Mahasiswa Teknik Informatika dari Gresik" },
  { start: 4.39, end: 8.23, text: "yang terobsesi mengubah ide rumit jadi produk digital fungsional." },
  { start: 8.86, end: 10.18, text: "Dua senjata utama saya:" },
  { start: 10.70, end: 14.43, text: "web development interaktif, dan automasi sistem berbasis AI." },
  { start: 14.90, end: 15.86, text: "Bukan sekadar teori." },
  { start: 16.26, end: 18.92, text: "Saya bangun langsung aplikasi finansial Nabungin, ZliritDO," },
  { start: 19.23, end: 22.18, text: "sampai workflow agent pintar." },
  { start: 22.55, end: 24.32, text: "Selalu penasaran, selalu membangun." },
  { start: 24.68, end: 28.50, text: "Mari kolaborasi wujudkan ide bareng di dickyandrean.my.id!" }
];

function updateSubtitle(t) {
  if (!subEnabled) {
    subEl.classList.remove('visible');
    return;
  }
  const cur = subtitles.find(s => t >= s.start && t <= s.end);
  if (cur) {
    if (subEl.textContent !== cur.text) subEl.textContent = cur.text;
    subEl.classList.add('visible');
  } else {
    subEl.classList.remove('visible');
  }
}

function play() {
  isPlaying = true;
  tl.play();
  vo.currentTime = tl.time();
  vo.play().catch(e => console.log('Audio error:', e));
  playOverlay.classList.add('hidden');
  toggleText.textContent = 'Pause';
  toggleIcon.innerHTML = '<rect x="6" y="4" width="4" height="16" fill="currentColor"/><rect x="14" y="4" width="4" height="16" fill="currentColor"/>';
}

function pause() {
  isPlaying = false;
  tl.pause();
  vo.pause();
  playOverlay.classList.remove('hidden');
  toggleText.textContent = 'Putar';
  toggleIcon.innerHTML = '<polygon points="6,4 20,12 6,20" fill="currentColor"/>';
}

function togglePlay() {
  if (isPlaying) {
    pause();
  } else {
    play();
  }
}

function replay() {
  tl.time(0);
  vo.currentTime = 0;
  play();
}

// Event Listeners untuk Tombol
btnToggle.addEventListener('click', e => {
  e.stopPropagation();
  togglePlay();
});

btnToggleSub.addEventListener('click', e => {
  e.stopPropagation();
  subEnabled = !subEnabled;
  subBtnText.textContent = subEnabled ? 'Sub: ON' : 'Sub: OFF';
  updateSubtitle(tl.time());
});

btnReplay.addEventListener('click', e => {
  e.stopPropagation();
  replay();
});

playOverlay.addEventListener('click', () => {
  play();
});

// Loop otomatis saat pertunjukan selesai
tl.eventCallback('onComplete', () => {
  replay();
});

// Sinkronisasi Frame-Accurate Timeline & Audio
gsap.ticker.add(() => {
  if (!isPlaying || tl.paused()) return;
  if (Math.abs(vo.currentTime - tl.time()) > 0.15) {
    vo.currentTime = tl.time();
  }
  updateSubtitle(tl.time());
});

// Kontrol Tombol Keyboard: Space (Play/Pause), R (Replay)
window.addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault();
    togglePlay();
  } else if (e.key === 'r' || e.key === 'R') {
    replay();
  }
});

// Panel Scrub Debug (?debug=1)
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.has('debug')) {
  const dbg = $('#dbg');
  const dPlay = $('#dPlay');
  const dScrub = $('#dScrub');
  const dClock = $('#dClock');
  dbg.style.display = 'flex';

  dPlay.onclick = () => {
    if (tl.paused()) { tl.play(); vo.play(); dPlay.textContent = 'Pause'; }
    else { tl.pause(); vo.pause(); dPlay.textContent = 'Play'; }
  };

  dScrub.oninput = () => {
    const t = (dScrub.value / 2890) * DUR;
    tl.pause(t);
    vo.pause();
    vo.currentTime = t;
    dClock.textContent = t.toFixed(2) + 's';
    updateSubtitle(t);
  };

  gsap.ticker.add(() => {
    if (!tl.paused()) {
      dScrub.value = Math.round((tl.time() / DUR) * 2890);
      dClock.textContent = tl.time().toFixed(2) + 's';
    }
  });
}

// Expose OPENER for automated snapshot & verification tools
window.OPENER = {
  W, H, DURATION: DUR, tl,
  seek(t) {
    tl.pause(t, false);
    if (gsap.ticker.tick) gsap.ticker.tick();
  },
  play: start
};

// Mulai dalam kondisi standby paused (klik Play untuk putar dengan suara)
pause();
</script>
